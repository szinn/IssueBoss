syntax = "proto3";

package issueboss.admin;

// ── Shared ───────────────────────────────────────────────────────────────────

message Empty {}

// ── User messages ─────────────────────────────────────────────────────────────

message UserResponse {
  string token                    = 1;
  string username                 = 2;
  string full_name                = 3;
  string email                    = 4;
  repeated string capabilities    = 5;
  bool   change_password_on_login = 7;
  string created_at               = 8;  // RFC 3339
  string updated_at               = 9;  // RFC 3339
}

message SuperAdminRequest {
  string username  = 1;
  string full_name = 2;
  string email     = 3;
  string password  = 4;
}

message SuperAdminResponse {
  string username   = 1;
  string email      = 2;
  string api_key    = 3;  // plaintext — shown once, never stored
  string key_prefix = 4;
  string key_type   = 5;
}

message CreateUserRequest {
  string username  = 1;
  string full_name = 2;
  string email     = 3;
  string password  = 4;
}

message GetUserRequest {
  string username = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated UserResponse users = 1;
}

message UpdateUserRequest {
  string          username   = 1;
  optional string full_name  = 2;
  optional string email      = 3;
}

message DeleteUserRequest {
  string username = 1;
}

// ── API Key messages ──────────────────────────────────────────────────────────

message ApiKeyEntry {
  uint64 api_key_id   = 1;  // numeric ID — use for revocation
  string key_type     = 2;  // "ib_live"
  string key_prefix   = 3;  // first 12 chars for display
  string name         = 4;  // optional label, empty string if unset
  string created_at   = 5;  // RFC 3339
  string last_used_at = 6;  // RFC 3339, empty string if never used
}

message CreateApiKeyRequest {
  string username = 1;
  string key_type = 2;  // e.g. "ib_live"
  string name     = 3;  // optional label
}

message CreateApiKeyResponse {
  string username   = 1;
  string api_key    = 2;  // plaintext — shown once
  string key_prefix = 3;
  string key_type   = 4;
  uint64 api_key_id = 5;  // numeric ID — use for future revocation
}

message RevokeApiKeyRequest {
  uint64 api_key_id = 1;
}

message ListApiKeysRequest {
  string username = 1;
}

message ListApiKeysResponse {
  repeated ApiKeyEntry keys = 1;
}

// ── Project messages ──────────────────────────────────────────────────────────

message ProjectResponse {
  string token        = 1;
  string name         = 2;
  string slug         = 3;
  string prefix       = 4;
  string created_at   = 5;  // RFC 3339
  string updated_at   = 6;  // RFC 3339
  optional string description = 7;
}

message CreateProjectRequest {
  string name             = 1;
  string slug             = 2;
  string prefix           = 3;
  optional string description = 4;
}

message UpdateProjectRequest {
  string          slug = 1;
  optional string name = 2;
}

message DeleteProjectRequest {
  string slug = 1;
}

message GetProjectRequest {
  string slug = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated ProjectResponse projects = 1;
}

// ── Project member messages ───────────────────────────────────────────────────

message ProjectMemberResponse {
  string          project_token = 1;
  string          user_token    = 2;
  string          username      = 3;
  repeated string capabilities  = 4;
  string          created_at    = 5;  // RFC 3339
  string          updated_at    = 6;  // RFC 3339
}

message AddProjectMemberRequest {
  string          project_slug = 1;
  string          username     = 2;
  repeated string capabilities = 3;
}

message UpdateProjectMemberRequest {
  string          project_slug = 1;
  string          username     = 2;
  repeated string capabilities = 3;
}

message RemoveProjectMemberRequest {
  string project_slug = 1;
  string username     = 2;
}

message ListProjectMembersRequest {
  string project_slug = 1;
}

message ListProjectMembersResponse {
  repeated ProjectMemberResponse members = 1;
}

// ── Issue messages ────────────────────────────────────────────────────────────

message IssueResponse {
  string          token         = 1;
  string          project_slug  = 2;
  uint32          number        = 3;
  string          title         = 4;
  string          description   = 5;
  string          status        = 6;
  string          priority      = 7;
  optional string size          = 8;
  string          slug          = 9;
  string          created_at    = 10;  // RFC 3339
  string          updated_at    = 11;  // RFC 3339
  IssueRelationshipsProto relationships = 12;
  string          submitter     = 13;           // username of submitter, "unknown" if deleted
  optional string assigned      = 14;           // username of assignee, omitted if unassigned
}

message CreateIssueRequest {
  string          project_slug = 1;
  string          title        = 2;
  string          description  = 3;
  string          priority     = 4;   // IssuePriority as string, e.g. "High"
  optional string size         = 5;   // IssueSize as string, e.g. "Small"
}

message UpdateIssueRequest {
  string          slug        = 1;   // issue slug, e.g. "IB-1"
  optional string title       = 2;
  optional string description = 3;
  reserved 4;                        // was: status — use TransitionIssue instead
  optional string priority    = 5;
  optional string size        = 6;
}

message GetIssueRequest {
  string slug = 1;   // issue slug, e.g. "IB-1"
}

message ListIssuesRequest {
  string          project_slug    = 1;
  optional string status          = 2;
  optional string priority        = 3;
  optional string size            = 4;
  optional uint64 limit           = 5;
  optional bool   exclude_blocked = 6;
}

message ListIssuesResponse {
  repeated IssueResponse issues = 1;
}

message TransitionIssueRequest {
  string slug       = 1;   // issue slug, e.g. "IB-1"
  string new_status = 2;   // IssueStatus as string, e.g. "InDev"
}

// ── Relationship messages ─────────────────────────────────────────────────────

message RelatedIssueSummary {
  int64  id    = 1;
  string slug  = 2;
  string title = 3;
}

message IssueRelationshipsProto {
  repeated RelatedIssueSummary depends_on = 1;
  repeated RelatedIssueSummary blocks     = 2;
  repeated RelatedIssueSummary related_to = 3;
}

message AddRelationshipRequest {
  string from_slug = 1;
  string to_slug   = 2;
  string kind      = 3;
}

message RemoveRelationshipRequest {
  string from_slug = 1;
  string to_slug   = 2;
  string kind      = 3;
}

message ListRelationshipsRequest {
  string issue_slug = 1;
}

message ListRelationshipsResponse {
  IssueRelationshipsProto relationships = 1;
}

message RelationshipResponse {
  string from_slug = 1;
  string to_slug   = 2;
  string kind      = 3;
}

// ── Artifact messages ─────────────────────────────────────────────────────────

message ArtifactResponse {
  optional string slug       = 1;
  string          kind       = 2;
  string          body_json  = 3;  // serde_json serialized body
  string          created_at = 4;  // RFC 3339
  string          updated_at = 5;  // RFC 3339
}

message AddArtifactRequest {
  string          issue_slug = 1;
  string          kind       = 2;   // ArtifactKind as string, e.g. "Comment"
  optional string slug       = 3;   // required for kinds that need a slug
  string          body_json  = 4;   // serde_json serialized body
}

message UpdateArtifactRequest {
  string issue_slug      = 1;   // issue slug, e.g. "IB-1"
  uint32 artifact_number = 2;   // artifact ID
  string body_json       = 3;   // serde_json serialized body
}

message RemoveArtifactRequest {
  string issue_slug      = 1;   // issue slug, e.g. "IB-1"
  uint32 artifact_number = 2;   // artifact ID
}

message ListArtifactsRequest {
  string          issue_slug    = 1;
  repeated string kinds         = 2;   // filter by ArtifactKind strings; empty = all
}

message ListArtifactsResponse {
  repeated ArtifactResponse artifacts = 1;
}

message MoveArtifactRequest {
  string old_path = 1;
  string new_path = 2;
}

// ── Service ───────────────────────────────────────────────────────────────────

service AdminService {

  // Bootstrap — no auth required
  rpc SuperAdmin(SuperAdminRequest) returns (SuperAdminResponse);

  // User management — requires SuperAdmin or Admin capability
  rpc CreateUser(CreateUserRequest)       returns (UserResponse);
  rpc GetUser(GetUserRequest)             returns (UserResponse);
  rpc ListUsers(ListUsersRequest)         returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest)       returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest)       returns (Empty);

  // API key management — requires SuperAdmin or Admin capability
  rpc CreateApiKey(CreateApiKeyRequest)   returns (CreateApiKeyResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest)   returns (Empty);
  rpc ListApiKeys(ListApiKeysRequest)     returns (ListApiKeysResponse);

  // Project management — requires SuperAdmin or Admin capability
  rpc CreateProject(CreateProjectRequest)   returns (ProjectResponse);
  rpc UpdateProject(UpdateProjectRequest)   returns (ProjectResponse);
  rpc DeleteProject(DeleteProjectRequest)   returns (Empty);
  rpc GetProject(GetProjectRequest)         returns (ProjectResponse);
  rpc ListProjects(ListProjectsRequest)     returns (ListProjectsResponse);

  // Project member management — requires SuperAdmin or Admin capability
  rpc AddProjectMember(AddProjectMemberRequest)       returns (ProjectMemberResponse);
  rpc UpdateProjectMember(UpdateProjectMemberRequest) returns (ProjectMemberResponse);
  rpc RemoveProjectMember(RemoveProjectMemberRequest) returns (Empty);
  rpc ListProjectMembers(ListProjectMembersRequest)   returns (ListProjectMembersResponse);

  // Issue management — requires SuperAdmin or Admin capability
  rpc CreateIssue(CreateIssueRequest)         returns (IssueResponse);
  rpc UpdateIssue(UpdateIssueRequest)         returns (IssueResponse);
  rpc GetIssue(GetIssueRequest)               returns (IssueResponse);
  rpc ListIssues(ListIssuesRequest)           returns (ListIssuesResponse);
  rpc TransitionIssue(TransitionIssueRequest) returns (IssueResponse);

  // Artifact management — requires project membership with appropriate capability
  rpc AddArtifact(AddArtifactRequest)         returns (ArtifactResponse);
  rpc UpdateArtifact(UpdateArtifactRequest)   returns (ArtifactResponse);
  rpc RemoveArtifact(RemoveArtifactRequest)   returns (Empty);
  rpc ListArtifacts(ListArtifactsRequest)     returns (ListArtifactsResponse);
  rpc MoveArtifact(MoveArtifactRequest)       returns (Empty);

  // Relationship management — requires project membership with appropriate capability
  rpc AddRelationship(AddRelationshipRequest)       returns (RelationshipResponse);
  rpc RemoveRelationship(RemoveRelationshipRequest) returns (Empty);
  rpc ListRelationships(ListRelationshipsRequest)   returns (ListRelationshipsResponse);
}
