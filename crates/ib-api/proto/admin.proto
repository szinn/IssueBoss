syntax = "proto3";

package issueboss.admin;

// ── Shared ───────────────────────────────────────────────────────────────────

message Empty {}

// ── User messages ─────────────────────────────────────────────────────────────

message UserResponse {
  string token                    = 1;
  string username                 = 2;
  string full_name                = 3;
  string email                    = 4;
  repeated string capabilities    = 5;
  string api_key_prefix           = 6;  // empty string when no key set
  bool   change_password_on_login = 7;
  string created_at               = 8;  // RFC 3339
  string updated_at               = 9;  // RFC 3339
}

message SuperAdminRequest {
  string username  = 1;
  string full_name = 2;
  string email     = 3;
  string password  = 4;
}

message SuperAdminResponse {
  string username = 1;
  string email    = 2;
  string api_key  = 3;  // plaintext — shown once, never stored
}

message CreateUserRequest {
  string username  = 1;
  string full_name = 2;
  string email     = 3;
  string password  = 4;
}

message GetUserRequest {
  string username = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated UserResponse users = 1;
}

message UpdateUserRequest {
  string          username   = 1;
  optional string full_name  = 2;
  optional string email      = 3;
}

message DeleteUserRequest {
  string username = 1;
}

message RotateApiKeyRequest {
  string username = 1;
}

message ApiKeyResponse {
  string username       = 1;
  string api_key        = 2;  // plaintext — shown once
  string api_key_prefix = 3;
}

// ── Service ───────────────────────────────────────────────────────────────────

service AdminService {

  // Bootstrap — no auth required
  rpc SuperAdmin(SuperAdminRequest) returns (SuperAdminResponse);

  // User management — requires SuperAdmin or Admin capability
  rpc CreateUser(CreateUserRequest)     returns (UserResponse);
  rpc GetUser(GetUserRequest)           returns (UserResponse);
  rpc ListUsers(ListUsersRequest)       returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest)     returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest)     returns (Empty);
  rpc RotateApiKey(RotateApiKeyRequest) returns (ApiKeyResponse);
}
